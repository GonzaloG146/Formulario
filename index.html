<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulario</title>
    <link rel="stylesheet" href="css/Style.css">
</head>

<body>

    <h1>Formulario</h1>

    <form>

        <!-- Nombre -->
        <label for="nombre">Nombre:</label><br>
        <input type="text" id="nombre" name="nombre" required><br><br>

        <!-- Apellido -->
        <label for="apellido">Apellido:</label><br>
        <input type="text" id="apellido" name="apellido" required><br><br>

        <!-- Tipo de documento -->
        <label for="tipo_identificacion">Tipo de Identificación:</label><br>
        <select id="tipo_identificacion" name="tipo_identificacion" required>
            <option value="" selected disabled>Seleccione el tipo de documento...</option>
            <option value="CC">Cédula de Ciudadanía (CC)</option>
            <option value="TI">Tarjeta de Identidad (TI)</option>
            <option value="PA">Pasaporte (PA)</option>
        </select><br><br>

        <!-- Número de identificación -->
        <label for="numero_identificacion">Número de Identificación:</label><br>
        <input
            type="text"
            id="numero_identificacion"
            name="numero_identificacion"
            placeholder="Ej: 123456789"
            maxlength="12"
            pattern="[0-9]+"
            inputmode="numeric"
            oninput="this.value=this.value.replace(/[^0-9]/g,'')"
            required><br><br>

        <!-- Fecha de nacimiento -->
        <label for="fecha_nacimiento">Fecha de Nacimiento:</label><br>
        <input type="date" id="fecha_nacimiento" name="fecha_nacimiento" required><br><br>

        <!-- Número de celular -->
        <label for="celular">Número de Celular:</label><br>
        <input
            type="tel"
            id="celular"
            name="celular"
            placeholder="Ej: 3004177843"
            maxlength="10"
            pattern="[0-9]{10}"
            inputmode="numeric"
            oninput="this.value=this.value.replace(/[^0-9]/g,'')"
            required><br><br>

        <!-- Correo -->
        <label for="correo">Correo Electrónico:</label><br>
        <input
            type="email"
            id="correo"
            name="correo"
            placeholder="micorreo@gmail.com"
            required><br><br>

        <!-- País -->
        <label for="pais">País de domicilio:</label><br>
        <input
            type="text"
            id="pais"
            name="pais"
            placeholder="Ej: Colombia"
            required><br><br>

        <!-- Ciudad -->
        <label for="ciudad">Ciudad de domicilio:</label><br>
        <input
            type="text"
            id="ciudad"
            name="ciudad"
            placeholder="Ej: Bogotá"
            required><br><br>

        <!-- Política de datos -->
        <input type="checkbox" id="politica_datos" name="politica_datos" required>
        <label for="politica_datos">
            Acepto la política de tratamiento de datos.
        </label><br><br>

        <!-- Botón -->
        <input type="submit" value="Enviar">

    </form>

</body>
</html>
